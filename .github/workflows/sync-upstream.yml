name: Sync upstream and build Android 12

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android12-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Android 12 branch
        uses: actions/checkout@v4
        with:
          ref: android12-arm32
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/seijikohara/femto-car-launcher.git

      - name: Merge upstream develop
        run: |
          git fetch upstream develop
          git merge --no-edit -X theirs upstream/develop

      - name: Enforce minimum SDK 31
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          content = path.read_text()

          updated, count = re.subn(
              r'(?m)^(\s*minSdk\s*=\s*)\d+\b',
              r'\g<1>31',
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one minSdk assignment; found {count}"
              )

          path.write_text(updated)
          print("Verified: minSdk = 31")
          PY

          git add app/build.gradle.kts

          if ! git diff --cached --quiet; then
            git commit -m "Enforce minSdk 31 for Android 12"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify compileSdk configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          content = Path("app/build.gradle.kts").read_text()

          match = re.search(
              r'(?m)^\s*compileSdk\s*=\s*(\d+)',
              content
          )

          if match:
              compile_sdk = int(match.group(1))
              if compile_sdk != 36:
                  raise SystemExit(
                      f"compileSdk is {compile_sdk}, but this workflow "
                      "installs Android SDK 36. Update the installed "
                      "platform to match compileSdk."
                  )
              print("Verified: compileSdk = 36")
          else:
              print(
                  "Could not find a literal compileSdk assignment. "
                  "Gradle will validate the SDK configuration."
              )
          PY

      - name: Build Android 12 APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleStableDebug

      - name: Verify APK exists
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/stable/debug \
            -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK minimum SDK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" \
            | grep -E "package:|sdkVersion:|targetSdkVersion:"

          SDK_VERSION=$("$AAPT" dump badging "$APK" \
            | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p")

          if [ "$SDK_VERSION" != "31" ]; then
            echo "ERROR: Expected minimum SDK 31, got $SDK_VERSION"
            exit 1
          fi

          echo "SUCCESS: APK minimum SDK is 31"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: femto-car-launcher-android12
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push synced branch
        run: git push origin HEAD:android12-arm32
